{% extends "base.html" %}
{% block title %}{{ key }}.log{% endblock %}
{% block sidebar %}{% include "_admin_sidebar.html" %}{% endblock %}
{% block content %}
<div class="card">
    <h2>{{ key }}.log (末尾{{ lines|length }}行)</h2>
    <input type="text" id="log-filter" class="search-box" style="max-width:400px;" placeholder="キーワードで絞り込み(例: ERROR, 2026-08-27)...">
    <p class="muted" id="log-filter-count"></p>
    <div class="table-scroll">
    <pre id="log-content" style="background:#1c2733; color:#e8edf1; padding:1rem; border-radius:6px; font-size:0.78rem; line-height:1.4; max-height:70vh; overflow-y:auto;">{{ lines|join('') }}</pre>
    </div>
</div>
<script>
(function() {
    var allLines = {{ lines|tojson }};
    var input = document.getElementById("log-filter");
    var pre = document.getElementById("log-content");
    var countLabel = document.getElementById("log-filter-count");
    input.addEventListener("input", function() {
        var q = input.value.trim();
        if (!q) {
            pre.textContent = allLines.join("");
            countLabel.textContent = "";
            return;
        }
        var filtered = allLines.filter(function(line) { return line.indexOf(q) !== -1; });
        pre.textContent = filtered.join("");
        countLabel.textContent = filtered.length + " / " + allLines.length + "行";
    });
})();
</script>
{% endblock %}
