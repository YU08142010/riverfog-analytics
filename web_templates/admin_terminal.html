{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}ターミナル{% endblock %}
{% block sidebar %}{% include "_admin_sidebar.html" %}{% endblock %}
{% block content %}
<div class="card">
    <h2>ターミナル</h2>
    <p class="muted">
        <code>{{ terminal_url }}</code>
        <button type="button" class="copy-btn" data-copy="{{ terminal_url }}" title="URLをコピー">{{ icon("copy") }}</button>
    </p>
    <iframe src="{{ terminal_url }}" style="width:100%; height:600px; border:0; border-radius: var(--radius-sm);"></iframe>
</div>
{% endblock %}
