{% extends "base.html" %}
{% block title %}{{ date }} {{ hhmm }}の画像{% endblock %}
{% block content %}
<div class="card">
    <h2>{{ date }} {{ hhmm[:2] }}:{{ hhmm[2:] }} のカメラ画像</h2>
    <p><a href="{{ url_for('images_date', date=date) }}">&laquo; {{ date }} の時刻一覧に戻る</a></p>
    {% if files %}
    <div class="image-grid">
        {% for f in files %}
        <figure class="{{ 'unavailable' if '_unavailable' in f else '' }}">
            <img src="{{ url_for('images_file', date=date, hhmm=hhmm, filename=f) }}" loading="lazy">
            <figcaption>{{ f.replace('_unavailable.jpg', '').replace('.jpg', '') }}{% if '_unavailable' in f %} (取得失敗){% endif %}</figcaption>
        </figure>
        {% endfor %}
    </div>
    {% else %}
    <p class="muted">この時刻の画像はありません。</p>
    {% endif %}
</div>
{% endblock %}
