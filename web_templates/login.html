{% extends "base_auth.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
    <h2 style="margin-top:0;">ログイン</h2>
    {% if error %}
    <p style="color: var(--color-danger);" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">
        <p>
            <label for="email">メールアドレス</label><br>
            <input type="email" id="email" name="email" required autofocus autocomplete="email"
                   style="width:100%; padding:0.5rem; margin-top:0.3rem; box-sizing:border-box;">
        </p>
        <p>
            <label for="password">パスワード</label><br>
            <input type="password" id="password" name="password" required autocomplete="current-password"
                   style="width:100%; padding:0.5rem; margin-top:0.3rem; box-sizing:border-box;">
        </p>
        <button type="submit" class="button">ログイン</button>
    </form>
    <p class="muted" style="margin-top:1rem;">アカウントをお持ちでない方は <a href="{{ url_for('signup') }}">こちら</a> から登録を申請できます。</p>
    <p class="muted" style="margin-top:0.6rem;"><a href="{{ url_for('public_forecast') }}">← 川霧の出やすさ(公開ページ)に戻る</a></p>
<script>
// ログアウトしたら、この端末に保存したページ・画像を消す(共用の端末で次の人に見えないように)
try { if (window.caches) { caches.delete("rf-pages-v1"); caches.delete("rf-images-v1"); } } catch (e) {}
</script>
{% endblock %}
