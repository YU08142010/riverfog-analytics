{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
<div class="card" style="max-width:380px; margin:0 auto;">
    <h2>ログイン</h2>
    {% if error %}
    <p style="color: var(--color-danger);">{{ error }}</p>
    {% endif %}
    <form method="post">
        <input type="hidden" name="next" value="{{ next }}">
        <p>
            <label for="email">メールアドレス</label><br>
            <input type="email" id="email" name="email" required autofocus
                   style="width:100%; padding:0.5rem; margin-top:0.3rem; box-sizing:border-box;">
        </p>
        <p>
            <label for="password">パスワード</label><br>
            <input type="password" id="password" name="password" required
                   style="width:100%; padding:0.5rem; margin-top:0.3rem; box-sizing:border-box;">
        </p>
        <button type="submit" class="button">ログイン</button>
    </form>
    <p class="muted" style="margin-top:1rem;">アカウントをお持ちでない方は <a href="{{ url_for('signup') }}">こちら</a> から登録を申請できます。</p>
</div>
{% endblock %}
