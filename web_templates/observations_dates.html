{% extends "base.html" %}
{% block title %}観測データ{% endblock %}
{% block content %}
<div class="card">
    <h2>観測データ(日付一覧)</h2>
    <p class="muted">元データ全体は共有フォルダの「只見川.xlsx」からも参照できます。</p>
    {% if dates %}
    <ul class="date-list">
        {% for d in dates %}
        <li><a href="{{ url_for('observations_date', date=d) }}">{{ d }}</a></li>
        {% endfor %}
    </ul>
    {% else %}
    <p class="muted">観測データがまだありません。</p>
    {% endif %}
</div>
{% endblock %}
