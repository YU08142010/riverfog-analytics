{% extends "base.html" %}
{% block title %}{{ date }}の画像{% endblock %}
{% block content %}
<div class="card">
    <h2>{{ date }} の撮影時刻一覧</h2>
    <p><a href="{{ url_for('images_dates') }}">&laquo; 日付一覧に戻る</a></p>
    {% if hours %}
    <ul class="date-list">
        {% for h in hours %}
        <li><a href="{{ url_for('images_hour', date=date, hhmm=h) }}">{{ h[:2] }}:{{ h[2:] }}</a></li>
        {% endfor %}
    </ul>
    {% else %}
    <p class="muted">この日の画像はありません。</p>
    {% endif %}
</div>
{% endblock %}
