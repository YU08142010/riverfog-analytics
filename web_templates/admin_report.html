{% extends "base.html" %}
{% block title %}レポート{% endblock %}
{% block sidebar %}{% include "_admin_sidebar.html" %}{% endblock %}
{% block content %}
<div class="card">
    <h2>期間レポートの生成</h2>
    <p class="muted">指定した期間の霧発生回数・予測的中率をまとめたPDFレポートをダウンロードします。
        観測データ量によっては生成に数秒〜数十秒かかることがあります。</p>
    <form method="post" action="{{ url_for('admin_report') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p>
            <label>開始日<br>
                <input type="date" name="start_date" value="{{ default_start }}" required style="padding:0.4rem;">
            </label>
        </p>
        <p>
            <label>終了日<br>
                <input type="date" name="end_date" value="{{ default_end }}" required style="padding:0.4rem;">
            </label>
        </p>
        <button type="submit" class="button">PDFを生成してダウンロード</button>
    </form>
</div>
{% endblock %}
