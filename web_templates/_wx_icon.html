{# 動く天気アイコン。wx_icon(wx) で、_weather_sceneの結果(kind/phase)に合わせたSVGを出す。
   動きはweather_scene.cssの .wxi-* (動きを減らす設定では止まる)。 #}
{% macro wx_icon(wx, size=28) %}
{% set night = wx.phase == "night" %}
<svg class="wxi wxi-{{ wx.kind }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true">
{% if wx.kind == "clear" %}
    {% if night %}
    <path class="wxi-moon" d="M21 5.5a10 10 0 1 0 5.5 16.4A11 11 0 0 1 21 5.5z"/>
    <circle class="wxi-star" cx="8" cy="7" r="1"/><circle class="wxi-star wxi-star2" cx="13" cy="4" r="0.7"/>
    {% else %}
    <g class="wxi-sun"><circle cx="16" cy="16" r="6"/>
    <path class="wxi-rays" d="M16 3v4M16 25v4M3 16h4M25 16h4M6.8 6.8l2.8 2.8M22.4 22.4l2.8 2.8M6.8 25.2l2.8-2.8M22.4 9.6l2.8-2.8"/></g>
    {% endif %}
{% elif wx.kind in ("riverfog", "fog") %}
    {% if wx.kind == "riverfog" %}
    {% if night %}<path class="wxi-moon wxi-small" d="M22 3.5a6 6 0 1 0 4 9.8A7 7 0 0 1 22 3.5z"/>{% else %}<circle class="wxi-sunsmall" cx="23" cy="8" r="4"/>{% endif %}
    {% endif %}
    <path class="wxi-fogline wxi-f1" d="M4 15h17"/>
    <path class="wxi-fogline wxi-f2" d="M8 20h20"/>
    <path class="wxi-fogline wxi-f3" d="M3 25h16"/>
    {% if wx.kind == "fog" %}<path class="wxi-fogline wxi-f4" d="M9 10h15"/>{% endif %}
{% elif wx.kind == "cloud" %}
    <path class="wxi-cloud" d="M9 23h14a5 5 0 0 0 0-10 7 7 0 0 0-13.4 1.5A4.3 4.3 0 0 0 9 23z"/>
{% else %}
    <path class="wxi-cloud" d="M9 19h14a5 5 0 0 0 0-10 7 7 0 0 0-13.4 1.5A4.3 4.3 0 0 0 9 19z"/>
    <path class="wxi-drop wxi-d1" d="M11 22l-1.5 4"/><path class="wxi-drop wxi-d2" d="M17 22l-1.5 4"/><path class="wxi-drop wxi-d3" d="M23 22l-1.5 4"/>
{% endif %}
</svg>
{% endmacro %}
