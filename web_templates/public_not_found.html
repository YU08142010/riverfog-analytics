{% extends "public_base.html" %}
{# 公開ページ・ログインしていない人向けの「ページが見つかりません」(2026-10-20。以前は英語の素の画面だった)。 #}
{% block title %}{{ pf_t('not_found_title') }}{% endblock %}
{% block content %}
<div class="pf-card" style="text-align:center; padding:2rem 1.2rem;">
    <h1 style="margin:0 0 0.6rem; font-size:1.4rem;">{{ pf_t('not_found_title') }}</h1>
    <p class="pf-muted" style="margin:0 0 1.2rem;">{{ pf_t('not_found_body') }}</p>
    <p style="margin:0;"><a href="{{ url_for('public_forecast') }}">{{ pf_t('not_found_back') }}</a></p>
</div>
{% endblock %}
