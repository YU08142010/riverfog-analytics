{% extends "base.html" %}
{% from "_tab_groups.html" import analysis_tabs, data_tabs %}
{% block title %}気象条件別の川霧発生状況{% endblock %}
{% block sidebar %}{% include "_station_sidebar.html" %}{% endblock %}
{% block content %}
{{ analysis_tabs() }}
<div class="card">
    <h2 style="margin-top:0;">気象条件別の川霧発生状況</h2>
    <label class="muted" style="font-size:0.85rem;">地点</label><br>
    <select onchange="location.href='{{ url_for('weather_fog_graph_page') }}?station=' + encodeURIComponent(this.value)">
        {% for region_label in ["只見川", "会津"] %}
        {% set region_names = station_names|select("in", station_names_by_region.get(region_label, []))|list %}
        {% if region_names %}
        <optgroup label="{{ region_label }}">
            {% for s in region_names %}
            <option value="{{ s }}" {{ "selected" if s == station }}>{{ s }}</option>
            {% endfor %}
        </optgroup>
        {% endif %}
        {% endfor %}
    </select>
</div>

<div class="card">
    <div class="chart-wrap"><div class="spinner"></div><div class="chart-themed" role="img" aria-label="{{ station }}の気象条件別川霧発生状況" data-chart-url="{{ url_for('weather_fog_graph_png', station=station) }}"></div></div>
</div>
{% endblock %}
