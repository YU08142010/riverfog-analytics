<style>
    .phenom-picker-row { display:flex; gap:0.35rem; flex-wrap:wrap; }
    .phenom-btn {
        border:2px solid transparent; border-radius:var(--radius-sm, 6px); padding:0.4rem 0.7rem;
        font-size:0.82rem; cursor:pointer; line-height:1.1; display:inline-flex; flex-direction:column;
        align-items:center; gap:0.1rem;
    }
    .phenom-btn .phenom-key { font-size:0.68rem; opacity:0.75; }
    .phenom-btn.active { border-color:#111; box-shadow:0 0 0 2px rgba(0,0,0,0.15) inset; }
</style>
<script>
(function() {
    document.querySelectorAll(".phenom-picker-form").forEach(function(form) {
        if (form.dataset.phenomPickerWired) return;
        form.dataset.phenomPickerWired = "1";
        var picker = form.querySelector(".phenom-picker");
        var catRow = form.querySelector(".phenom-picker-categories");
        var subRow = form.querySelector(".phenom-picker-sublevels");
        var valueInput = form.querySelector(".phenom-picker-value");
        var selectedLabel = form.querySelector(".phenom-picker-selected-label");
        var labels = JSON.parse(form.dataset.phenomLabels || "{}");
        labels[0] = "現象なし";
        var currentCode = parseInt(form.dataset.currentCode, 10);

        function setActive(row, btn) {
            row.querySelectorAll(".phenom-btn").forEach(function(b) { b.classList.remove("active"); });
            if (btn) btn.classList.add("active");
        }

        function codesKeyFor(code) {
            for (var i = 0; i < catRow.children.length; i++) {
                var codes = catRow.children[i].dataset.codes.split(",").map(Number);
                if (codes.indexOf(code) !== -1) return catRow.children[i].dataset.codes;
            }
            return String(code);
        }

        function showSublevels(catBtn, activeCode) {
            var codes = catBtn.dataset.codes.split(",").map(Number);
            subRow.innerHTML = "";
            if (codes.length <= 1) {
                subRow.hidden = true;
                return;
            }
            codes.forEach(function(code) {
                var b = document.createElement("button");
                b.type = "button";
                b.className = "phenom-btn";
                b.textContent = labels[code] || ("コード" + code);
                b.dataset.code = code;
                if (code === activeCode) b.classList.add("active");
                b.addEventListener("click", function() {
                    valueInput.value = code;
                    selectedLabel.textContent = labels[code] || ("コード" + code);
                    setActive(subRow, b);
                });
                subRow.appendChild(b);
            });
            subRow.hidden = false;
        }

        function selectCode(code) {
            valueInput.value = code;
            selectedLabel.textContent = labels[code] || ("コード" + code);
            var catBtn = catRow.querySelector('.phenom-btn[data-codes="' + codesKeyFor(code) + '"]');
            setActive(catRow, catBtn);
            if (catBtn) showSublevels(catBtn, code);
        }

        catRow.querySelectorAll(".phenom-btn").forEach(function(btn) {
            btn.addEventListener("click", function() {
                var codes = btn.dataset.codes.split(",").map(Number);
                setActive(catRow, btn);
                if (codes.length === 1) {
                    subRow.hidden = true;
                    subRow.innerHTML = "";
                    valueInput.value = codes[0];
                    selectedLabel.textContent = labels[codes[0]] || ("コード" + codes[0]);
                } else {
                    showSublevels(btn, codes.indexOf(currentCode) !== -1 ? currentCode : codes[0]);
                    if (codes.indexOf(currentCode) === -1) {
                        valueInput.value = codes[0];
                        selectedLabel.textContent = labels[codes[0]] || ("コード" + codes[0]);
                    }
                }
            });
        });

        selectCode(currentCode);

        var hovered = false;
        picker.addEventListener("mouseenter", function() { hovered = true; });
        picker.addEventListener("mouseleave", function() { hovered = false; });
        document.addEventListener("keydown", function(e) {
            if (!hovered) return;
            var code = null;
            if (e.key >= "0" && e.key <= "9") code = parseInt(e.key, 10);
            else if (e.key === "-") code = 10;
            if (code === null) return;
            e.preventDefault();
            selectCode(code);
        });
    });
})();
</script>
