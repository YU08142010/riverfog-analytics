<div class="sidebar-panel">
    <a href="{{ url_for('chat_page', new=1) }}" class="button" style="display:block; width:100%; text-align:center; box-sizing:border-box; margin-bottom:0.6rem;">+ 新規チャット</a>
    <ul class="sidebar-list chat-sidebar-list">
        {% for c in conversations %}
        <li>
            <a href="{{ url_for('chat_page', c=c.id) }}"
               class="{{ 'active' if conversation and conversation.id == c.id else '' }}"
               id="chat-sidebar-item-{{ c.id }}">
                <span class="sidebar-label">{{ c.title or "新しいチャット" }}</span>
            </a>
            <button type="button" class="chat-delete-btn" data-conversation-id="{{ c.id }}" aria-label="この会話を削除" title="削除">×</button>
        </li>
        {% else %}
        <li class="muted chat-sidebar-empty" style="padding:0.6rem 0.6rem; font-size:0.82rem;">まだ会話はありません。</li>
        {% endfor %}
    </ul>
</div>
<script>
(function() {
    var sidebarList = document.querySelector(".chat-sidebar-list");
    if (!sidebarList) { return; }
    sidebarList.addEventListener("click", function(e) {
        var btn = e.target.closest(".chat-delete-btn");
        if (!btn) { return; }
        e.preventDefault();
        confirmModal("この会話を削除しますか？元に戻せません。").then(function(ok) {
            if (!ok) { return; }
            var conversationId = btn.getAttribute("data-conversation-id");
            var formData = new FormData();
            formData.set("csrf_token", "{{ csrf_token() }}");
            btn.disabled = true;
            fetch("/chat/" + conversationId + "/delete", {
                method: "POST",
                body: formData,
                headers: {"X-Requested-With": "XMLHttpRequest"},
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!data.success) { btn.disabled = false; return; }
                var li = btn.closest("li");
                var wasActive = !!li.querySelector("a.active");
                li.remove();
                if (wasActive) {
                    window.location.href = "{{ url_for('chat_page') }}";
                } else if (!sidebarList.querySelector("li:not(.chat-sidebar-empty)")) {
                    var empty = document.createElement("li");
                    empty.className = "muted chat-sidebar-empty";
                    empty.style.padding = "0.6rem 0.6rem";
                    empty.style.fontSize = "0.82rem";
                    empty.textContent = "まだ会話はありません。";
                    sidebarList.appendChild(empty);
                }
            })
            .catch(function() { btn.disabled = false; });
        });
    });
})();
</script>
