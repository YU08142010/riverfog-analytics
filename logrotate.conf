# collect.log/predict.log/backfill_weather.log/webapp.log/backfill_images.logは
# 各Pythonスクリプト自身がlogging.handlers.RotatingFileHandlerで既にローテーションを
# 管理しており(サイズ超過時に自プロセスがファイルを再オープンするため欠落が起きない)、
# ここでも同じファイルを別の閾値(1M/4世代)でローテーションすると二重管理になり設定が
# バッティングする。cron.logはcrontabの`>> cron.log 2>&1`によるプレーンな追記のみで
# 自前のローテーション機構を持たないため、こちらはlogrotateで管理する。
/opt/river-fog/logs/cron.log
{
    size 1M
    rotate 4
    compress
    missingok
    notifempty
    # cron.logはPython側のRotatingFileHandlerのような「ローテーション後に自動で
    # ファイルを再オープンする」仕組みを持たないプレーンな追記ファイルのため、
    # copytruncateでその場でファイルを空にする(でないとcronの各ジョブが古い
    # (unlinkされた)ファイルディスクリプタに書き込み続け、ログが実質消失する)。
    copytruncate
}
